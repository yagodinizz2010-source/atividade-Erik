<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
</head>
<body>

    <!-- Elementos HTML -->
    <input type="text" id="nova-tarefa" placeholder="Nova tarefa...">
    <button id="btn-add">Adicionar Tarefa</button>
    <ul id="lista-tarefas"></ul>

    <!-- CDN do jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Código jQuery -->
    <script>
        $(document).ready(function() {
            $('#btn-add').click(function() {
                const item = $('#nova-tarefa').val();
                if (item !== '') {
                    $('#lista-tarefas').append(`<li>${item}</li>`);
                    $('#nova-tarefa').val(''); // Limpa o campo
                }
            });
        });
    </script>

</body>
</html>
